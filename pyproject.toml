[project]
name = "Ingestion-Service"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Louis903995", email = "louis@moises.fr"},
]
dependencies = ["pyodbc>=5.2.0", "fastapi>=0.116.1", "uvicorn>=0.35.0", "sqlalchemy>=2.0.42", "pydantic>=2.11.7", "sqlmodel>=0.0.24", "mistralai>=1.9.3", "levenshtein>=0.27.1"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
export_requirements = "pdm export -o requirements.txt --without-hashes"
build_docker_image = "bash -c 'VERSION=$(grep -oP \"version = \\\"\\K[^\\\"]+\" pyproject.toml); docker build -t ingestion-service:$VERSION -t ingestion-service:latest .'"
build_docker = { composite = ["export_requirements", "build_docker_image"] }
create_network = "docker network create mon-reseau"
run_sql_server = "docker run -e \"ACCEPT_EULA=Y\" -e \"SA_PASSWORD=MotDePasseUltraFort123!\" -p 1433:1433 --name sqlserver-dev -d --network mon-reseau mcr.microsoft.com/mssql/server:2022-latest"
container = "docker run --name ingestion-service --network mon-reseau ingestion-service:latest"
fastapi = "uvicorn app.main:app --reload"